name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v1.0.0）'
        required: true
        default: 'v1.0.0'

jobs:
  create-release:
    name: 创建 Release
    runs-on: ubuntu-latest

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取版本号
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: 生成 Release Notes
        id: generate_notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## 版本 ${{ steps.get_version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 发布日期：$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 主要变更" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "- 请参考 [CHANGELOG.md](./CHANGELOG.md) 了解完整变更记录" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.generate_notes.outputs.notes }}
          draft: false
          prerelease: false

  build-backend:
    name: 构建后端
    needs: create-release
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: rent_db_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: 构建后端
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: rent_db_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
        run: mvn clean package -DskipTests -B --no-transfer-progress

      - name: 上传后端产物到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./backend/target/rent-management-backend-1.0.0.jar
          asset_name: rent-management-backend-${{ needs.create-release.outputs.version }}.jar
          asset_content_type: application/java-archive

  build-admin-web:
    name: 构建管理后台
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - name: 安装依赖并构建
        working-directory: ./admin-web
        run: |
          npm ci
          npm run build

      - name: 打包前端产物
        run: |
          cd admin-web
          zip -r ../admin-web-${{ needs.create-release.outputs.version }}.zip dist/
          cd ..

      - name: 上传前端产物到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./admin-web-${{ needs.create-release.outputs.version }}.zip
          asset_name: admin-web-${{ needs.create-release.outputs.version }}.zip
          asset_content_type: application/zip
