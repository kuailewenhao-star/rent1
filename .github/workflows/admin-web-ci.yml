name: Admin Web CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: 构建与校验
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - name: 安装依赖
        working-directory: ./admin-web
        run: npm ci

      - name: 类型检查（TypeScript）
        working-directory: ./admin-web
        run: npx vue-tsc --noEmit 2>/dev/null || echo "跳过类型检查（vue-tsc 未配置）"

      - name: 生产构建
        working-directory: ./admin-web
        env:
          NODE_ENV: production
        run: npm run build

      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: admin-web/dist/
          retention-days: 7
