server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: rent-management-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rent_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password:

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.rent1.domain.**.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing}
  expiration:
    user: 86400000  # 24 hours in milliseconds
    admin: 28800000 # 8 hours in milliseconds

crypto:
  aes:
    secret-key: ${AES_SECRET_KEY:32-char-secret-key-here}

request:
  security:
    signature-secret: ${REQUEST_SIGNATURE_SECRET:rent1-default-signature-secret}

logging:
  level:
    com.rent1: DEBUG
    org.springframework: INFO
