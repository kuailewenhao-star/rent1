name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: 编译与测试
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: rent_db_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: 等待 MySQL 就绪
        run: |
          echo "等待 MySQL 服务启动..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -proot_test --silent; then
              echo "MySQL 已就绪"
              break
            fi
            echo "等待中... ($i/30)"
            sleep 2
          done

      - name: 编译与测试（Backend）
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: rent_db_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-jwt-secret-min-32-chars-long-string
          AES_SECRET: ci-test-aes-secret-1234567890123456
          REQUEST_SIGNATURE_SECRET: ci-test-sign-secret
        run: |
          mvn clean test -B --no-transfer-progress

      - name: 打包（跳过测试）
        if: success()
        working-directory: ./backend
        run: |
          mvn clean package -DskipTests -B --no-transfer-progress

      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7
